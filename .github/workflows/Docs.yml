name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - pre-inference
    tags: '*'
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write
  actions: write        # let julia-actions/cache evict its own caches

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: |
          git clone -b main https://github.com/nsiccha/Treebars.jl.git "$RUNNER_TEMP/Treebars.jl"
          git clone -b dev https://github.com/nsiccha/AlgebraOfVega.jl.git "$RUNNER_TEMP/AlgebraOfVega.jl"
          git clone -b dev https://github.com/nsiccha/HTMX.jl.git "$RUNNER_TEMP/HTMX.jl"
          git clone -b devibe https://github.com/nsiccha/HTMXObjects.jl.git "$RUNNER_TEMP/HTMXObjects.jl"
          julia --project=docs -e '
            using Pkg, TOML
            project = Base.active_project()
            config = TOML.parsefile(project)
            pop!(config, "sources", nothing)
            open(io -> TOML.print(io, config), project, "w")
            dependencies = ["Treebars", "AlgebraOfVega", "HTMX", "HTMXObjects"]
            Pkg.develop(vcat([PackageSpec(path=pwd())],
              [PackageSpec(path=joinpath(ENV["RUNNER_TEMP"], name * ".jl")) for name in dependencies]))
            Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
