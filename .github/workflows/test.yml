name: Run tests
on:
  push:
    branches: [main, dev, pre-inference]
  pull_request:
    # `edited` fires on title/body edits, NOT on new commits — pushing a fix to
    # a PR must re-run the suite, which is what `synchronize` reports.
    types: [opened, synchronize, reopened]
permissions:
  actions: write
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['lts', '1', 'pre']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        exclude:
          - os: macOS-latest
            julia-arch: x86
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - name: Develop unregistered dependencies
        run: |
          git clone -b dev https://github.com/nsiccha/Treebars.jl.git
          julia --project=. -e 'using Pkg; project_path = Base.active_project(); project = read(project_path, String); remote = "Treebars = {url = \"https://github.com/nsiccha/Treebars.jl\"}"; local_path = "Treebars = {path = \"Treebars.jl\"}"; @assert occursin(remote, project); write(project_path, replace(project, remote => local_path)); Pkg.develop(path="Treebars.jl"); Pkg.instantiate()'
      - name: Run tests
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.test(; coverage=true)'
